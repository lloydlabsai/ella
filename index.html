    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Ella?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ella is a LinkedIn content engine that turns your industry expertise into posts that build credibility and attract the right opportunities. It is a guided creation workspace — not a one-click generator — that walks you from topic research through a polished draft using real-time web research, your stated point of view, and LinkedIn algorithm intelligence."
          }
        },
        {
          "@type": "Question",
          "name": "How is Ella different from ChatGPT or other AI writing tools?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ella is built specifically for LinkedIn and specifically for people who already have expertise. It does not replace your voice — it structures your thinking. The workspace asks for your take in your own words, then uses that as the thesis the draft is built around. Under the hood it uses Claude Opus for final drafting (not a cheaper model), bakes in 2025-2026 LinkedIn algorithm rules, and enforces 20+ anti-AI-tell rules so the output does not read like templated AI copy."
          }
        },
        {
          "@type": "Question",
          "name": "How much does Ella cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ella is free. The current plan includes 3 post generations per month, unlimited use of the Post Scorer, real-time industry research, and persona research — no credit card required. A Pro tier with additional generations and fact validation is planned but not yet available."
          }
        },
        {
          "@type": "Question",
          "name": "How does Ella learn my writing voice?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "When you set up your profile, Ella runs persona research using web search to build a picture of your role, niche, audience, pain points, the topics you own, and the language cues that fit your voice. You can also paste your LinkedIn headline, about section, and experience. Every draft Ella generates uses this profile as the voice scaffold so the output sounds like you, not like generic AI."
          }
        },
        {
          "@type": "Question",
          "name": "What is the Post Scorer?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Post Scorer is a free, unlimited tool where you paste any LinkedIn draft and get an instant 0-100 score with a full breakdown across four categories: Hook (length, fold visibility, type), Structure (length, reading time, paragraphs, emoji density), CTA (question type, open-ended vs yes/no, disagreement-inviting), and Algorithm (hashtag count, external links, engagement bait detection). It runs entirely in your browser with no API calls, and there is an optional Optimize button that sends the draft to Claude for a rewrite."
          }
        },
        {
          "@type": "Question",
          "name": "What LinkedIn algorithm signals does Ella optimize for?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ella bakes 2025-2026 LinkedIn algorithm signals directly into its draft generation: dwell time as the primary ranking factor, conversation depth over vanity metrics, hooks within the first 210 characters before the 'see more' fold, 1200-1900 character optimal post length, questions that prompt long comment responses, no engagement bait, external links moved to the first comment instead of the post body, and 3-5 hashtags maximum."
          }
        },
        {
          "@type": "Question",
          "name": "How does the Ella creation workspace work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The workspace has six sections: Spark (pick a topic from Ella's web-researched suggestions or bring your own), Landscape (Ella auto-researches facts, angles, and stakeholders you can toggle on or off), Your Take (a short text area where you state your opinion or insight), Draft (Claude Opus generates one editable draft built around your take), Visual Direction (recommendations for data viz, carousel, stat graphic, or photo with a copyable visual brief), and Final Check (auto-scoring, hashtag toggles, character count, and copy button). Every section is collapsible and you can jump between them — nothing locks."
          }
        },
        {
          "@type": "Question",
          "name": "Does Ella fact-check its generated posts?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Ella's draft workspace has a 'Validate facts' action that uses Claude with web search to check claims, stats, and references in your draft and suggest corrections or current data to include. This runs during the drafting flow, not as a separate paid add-on."
          }
        },
        {
          "@type": "Question",
          "name": "Who is Ella for?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ella is for professionals whose career depends on being visible in their industry — founders, operators, consultants, specialists, and anyone whose LinkedIn profile functions as a digital background check. It is specifically built for people who already have expertise and a point of view, but do not have the time or the patience to turn every insight into a polished post."
          }
        }
      ]
    }
    </script>
